[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mapgen-core"
version = "0.2.0"
description = "Explicit-input, deterministic real-module map generation core"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mapgen = "mapgen.__main__:main"

[tool.setuptools]
packages = ["mapgen"]
