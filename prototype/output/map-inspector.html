function show(i){clear();document.querySelector(`[data-id="${i.id}"]`).classList.add('selected');const t=LIB[i.module_id];let rows=Object.entries(i.ports).map(([id,p])=>{const c=DATA.connections.find(c=>c.id===p.connection);const self=i.id+'.'+id;const other=c?(c.a===self?c.b:c.a):'封口';return `<tr><td><b>${id}</b></td><td>${p.face}<br>${p.surface}<br>${p.permission}<br><b>Block (${p.edge_block.join(', ')})</b><br>local (${p.local2.map(v=>v/2).join(', ')})</td><td>${p.connection||'×'}<br>${other}<br>(${p.world2.map(v=>v/2).join(', ')})</td></tr>`}).join('');info.innerHTML=`<h2>${i.id} · ${i.module_id}</h2><p>${esc(i.name)}</p><span class="tag">${i.size_blocks.join(' × ')} Block</span><span class="tag">origin (${i.origin.join(', ')})</span><span class="tag">mirror_x: ${i.mirror_x}</span><h3>Port / 初始权限 / 连接</h3><table><tr><th>ID</th><th>方向与类型</th><th>目标 / 世界坐标</th></tr>${rows}</table><h3>全部实际有效 Route (${i.actual_routes.length})</h3>${i.actual_routes.map(r=>`<div class="route-row"><code>${r.from_port} → ${r.content?'奖励 → ':''}${r.to_port}</code><div class="hint">能力 ${r.required_abilities.join(', ')} · 难度 ${r.difficulty} · 占位 ${r.estimated_duration}s</div></div>`).join('')||'<p>起点 / Boss 使用专用锚点。</p>'}<h3>封口后无效 Route (${i.inactive_routes.length})</h3><p class="hint">${i.inactive_routes.map(r=>r.id).join(' / ')||'无'}</p><p class="hint">四 Port 枢纽未声明 U↔D；不会因为同属一个矩形而自动连通。镜像不会转置 Route 矩阵。</p><div class="note">${esc(t.closure_model)}<br>Route / 接缝 / 镜像 / 封口：未做 Godot 物理认证。</div>`;
