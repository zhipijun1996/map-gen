<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1150" viewBox="0 0 1700 1150"><style>text{font-family:"Noto Sans CJK SC",sans-serif}</style><rect width="1700" height="1150" fill="#f8fafb"/><text x="55" y="60" font-size="33" fill="#263c4b" text-anchor="start" font-weight="700">接缝放大：同一个侧边，可以有多个不同 Block 的 Port</text><text x="55" y="110" font-size="21" fill="#607785" text-anchor="start" font-weight="400">取自本图 C32 / C33 / C37。每个小格 = 1 Block，边界 Block 坐标从 0 开始。</text><rect x="120" y="500" width="270" height="180" fill="#fcf0e9" stroke="#b87349" stroke-width="2"/><rect x="120" y="500" width="90" height="90" fill="none" stroke="#b87349" stroke-opacity=".25"/><rect x="120" y="590" width="90" height="90" fill="none" stroke="#b87349" stroke-opacity=".25"/><rect x="210" y="500" width="90" height="90" fill="none" stroke="#b87349" stroke-opacity=".25"/><rect x="210" y="590" width="90" height="90" fill="none" stroke="#b87349" stroke-opacity=".25"/><rect x="300" y="500" width="90" height="90" fill="none" stroke="#b87349" stroke-opacity=".25"/><rect x="300" y="590" width="90" height="90" fill="none" stroke="#b87349" stroke-opacity=".25"/><text x="255.0" y="575.0" font-size="19" fill="#b87349" text-anchor="middle" font-weight="700">M02 · T02b</text><text x="255.0" y="602.0" font-size="17" fill="#b87349" text-anchor="middle" font-weight="400">3×2</text><rect x="303" y="503" width="84" height="84" fill="#dcb69e" fill-opacity=".30"/><circle cx="390.0" cy="545.0" r="7" fill="#516b83"/><rect x="210" y="230" width="180" height="270" fill="#f3effa" stroke="#8c71a7" stroke-width="2"/><rect x="210" y="230" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="210" y="320" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="210" y="410" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="300" y="230" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="300" y="32