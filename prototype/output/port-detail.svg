400">(0,6)</text><rect x="480" y="230" width="90" height="90" fill="none" stroke="#b87349" stroke-opacity=".25"/><text x="525" y="280" font-size="16" fill="#ad8c79" text-anchor="middle" font-weight="400">(1,0)</text><rect x="480" y="320" width="90" height="90" fill="none" stroke="#b87349" stroke-opacity=".25"/><text x="525" y="370" font-size="16" fill="#ad8c79" text-anchor="middle" font-weight="400">(1,1)</text><rect x="480" y="410" width="90" height="90" fill="none" stroke="#b87349" stroke-opacity=".25"/><text x="525" y="460" font-size="16" fill="#ad8c79" text-anchor="middle" font-weight="400">(1,2)</text><rect x="480" y="500" width="90" height="90" fill="none" stroke="#b87349" stroke-opacity=".25"/><text x="525" y="550" font-size="16" fill="#ad8c79" text-anchor="middle" font-weight="400">(1,3)</text><rect x="480" y="590" width="90" height="90" fill="none" stroke="#b87349" stroke-opacity=".25"/><text x="525" y="640" font-size="16" fill="#ad8c79" text-anchor="middle" font-weight="400">(1,4)</text><rect x="480" y="680" width="90" height="90" fill="none" stroke="#b87349" stroke-opacity=".25"/><text x="525" y="730" font-size="16" fill="#ad8c79" text-anchor="middle" font-weight="400">(1,5)</text><rect x="480" y="770" width="90" height="90" fill="none" stroke="#b87349" stroke-opacity=".25"/><text x="525" y="820" font-size="16" fill="#ad8c79" text-anchor="middle" font-weight="400">(1,6)</text><text x="480.0" y="530.0" font-size="19" fill="#b87349" text-anchor="middle" font-weight="700">M06 · T10a</text><text x="480.0" y="557.0" font-size="17" fill="#b87349" text-anchor="middle" font-weight="400">2×7</text><rect x="393" y="233" width="84" height="84" fill="#dcb69e" fill-opacity=".30"/><circle cx="390.0" cy="275.0" r="7" fill="#516b83"/><text x="378.0" y="261.0" font-size="17" fill="#304e66" text-anchor="end" font-weight="700">L @ (0,0)</text><rect x="483" y="773" width="84" height="84" fill="#dcb69e" fill-opacity=".30"/><circle cx="570.0" cy="815.0" r="7" fill="#516b83"/><text x="582.0" y="801.0" font-size="17" fill="#304e66" text-anchor="start" font-weight="700">R @ (1,6)</text><rect x="393" y="503" width="84" height="84" fill="#dcb69e" fill-opacity=".30"/><circle cx="390.0" cy="545.0" r="7" fill="#516b83"/><text x="378.0" y="531.0" font-size="17" fill="#304e66" text-anchor="end" font-weight="700">L2 @ (0,3)</text><rect x="570" y="410" width="360" height="450" fill="#f3effa" stroke="#8c71a7" stroke-width="2"/><rect x="570" y="410" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="570" y="500" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="570" y="590" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="570" y="680" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="570" y="770" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="660" y="410" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="660" y="500" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="660" y="590" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="660" y="680" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="660" y="770" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="750" y="410" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="750" y="500" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="750" y="590" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="750" y="680" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="750" y="770" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="840" y="410" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="840" y="500" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="840" y="590" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="840" y="680" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><rect x="840" y="770" width="90" height="90" fill="none" stroke="#8c71a7" stroke-opacity=".25"/><text x="750.0" y="620.0" font-size="19" fill="#8c71a7" text-anchor="middle" font-weight="700">M07 · T11b</text><text x="750.0" y="647.0" font-size="17" fill="#8c71a7" text-anchor="middle" font-weight="400">4×5</text><rect x="573" y="773" width="84" height="84" fill="#dcb69e" fill-opacity=".30"/><circle cx="570.0" cy="815.0" r="7" fill="#516b83"/><text x="402" y="303.0" font-size="17" fill="#516b83" text-anchor="start" font-weight="700">C32</text><text x="402" y="573.0" font-size="17" fill="#516b83" text-anchor="start" font-weight="700">C33</text><text x="582" y="843.0" font-size="17" fill="#516b83" text-anchor="start" font-weight="700">C37</text><text x="960" y="250" font-size="27" fill="#263c4b" text-anchor="start" font-weight="700">C33 的坐标计算</text><text x="960" y="305" font-size="20" fill="#263c4b" text-anchor="start" font-weight="400">M02：origin = (5, −1)，尺寸 3×2</text><text x="960" y="344" font-size="20" fill="#263c4b" text-anchor="start" font-weight="400">R 在局部 Block (2, 0) 的右侧边中心</text><text x="960" y="383" font-size="20" fill="#263c4b" text-anchor="start" font-weight="400">局部 Port = (3, 0.5)</text><text x="960" y="422" font-size="20" fill="#263c4b" text-anchor="start" font-weight="400">世界 Port = (8, −0.5)</text><text x="960" y="495" font-size="20" fill="#263c4b" text-anchor="start" font-weight="400">M06：origin = (8, −4)，尺寸 2×7</text><text x="960" y="534" font-size="20" fill="#263c4b" text-anchor="start" font-weight="400">L2 在局部 Block (0, 3) 的左侧边中心</text><text x="960" y="573" font-size="20" fill="#263c4b" text-anchor="start" font-weight="400">局部 Port = (0, 3.5)</text><text x="960" y="612" font-size="20" fill="#263c4b" text-anchor="start" font-weight="400">世界 Port = (8, −0.5)</text><text x="960" y="686" font-size="22" fill="#b87349" text-anchor="start" font-weight="700">两端重合，但矩形顶边相差 3 Block。</text><text x="960" y="735" font-size="20" fill="#263c4b" text-anchor="start" font-weight="400">M06 同一左边还有 L：Block (0, 0)。</text><text x="960" y="774" font-size="20" fill="#263c4b" text-anchor="start" font-weight="400">它与另一个 Module 的 Port 对接。</text><text x="55" y="1060" font-size="22" fill="#607785" text-anchor="start" font-weight="400">左图深色格为接口所属 Block；圆点严格落在该格的外侧边中心。</text><text x="55" y="1100" font-size="22" fill="#607785" text-anchor="start" font-weight="400">Module 外形保持矩形；宽高和不同 Port 偏移共同产生错层拼接。</text></svg>