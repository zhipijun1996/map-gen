<!doctype html><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui,"Noto Sans CJK SC",sans-serif;color:#263b4a;background:#f0f3f6}header{height:70px;background:white;border-bottom:1px solid #d6dee5;display:flex;align-items:center;gap:12px;padding:0 22px}h1{font-size:19px;margin-right:20px}button,input{font:inherit;border:1px solid #cbd5de;border-radius:7px;padding:8px 12px;background:white;color:#263b4a}button{cursor:pointer}button:hover{background:#eaf1f7}button.active{background:#263b4a;color:white}main{display:grid;grid-template-columns:minmax(0,1fr) 370px;height:calc(100vh - 70px)}#viewport{overflow:hidden;cursor:grab;touch-action:none;background:#f8fafb}#viewport:active{cursor:grabbing}#viewport>svg{width:100%;height:100%;display:block}aside{overflow:auto;background:white;border-left:1px solid #d6dee5;padding:22px}h2{font-size:22px;margin:6px 0 12px}h3{font-size:14px;margin:22px 0 8px}p{line-height:1.7}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:8px 4px;text-align:left;border-bottom:1px solid #e9edf1}th{color:#768a97}.hint{color:#738492;font-size:12px}.tag{display:inline-block;padding:4px 8px;background:#eef3f7;border-radius:5px;margin:2px}code{font-size:12px}.route-row{padding:8px 0;border-bottom:1px solid #eee}.note{background:#fff3e5;color:#775e42;padding:12px;border-radius:6px;font-size:12px;line-height:1.7}#search{width:130px}.empty{padding:20px 0}.download{margin-top:14px} @media(max-width:900px){main{grid-template-columns:minmax(0,1fr) 290px}header{gap:5px;padding:0 10px}h1{font-size:15px;margin-right:4px}button{padding:7px}}</style><script>const DATA={};const LIB={};
const svg=document.querySelector('#viewport>svg'),info=document.querySelector('#info'),NS='http://www.w3.org/2000/svg';const instances=Object.fromEntries(DATA.instances.map(i=>[i.id,i]));let box=[0,0,3200,2290];
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function setbox(){svg.setAttribute('viewBox',box.join(' '))}function zoom(f,cx=box[0]+box[2]/2,cy=box[1]+box[3]/2){const w=box[2]*f,h=box[3]*f;if(w<240||w>10000)return;box=[cx-(cx-box[0])*f,cy-(cy-box[1])*f,w,h];setbox()}
document.querySelector('#fit').onclick=()=>{box=[0,0,3200,2290];setbox()};document.querySelector('#zin').onclick=()=>zoom(.75);document.querySelector('#zout').onclick=()=>zoom(1.3);
svg.addEventListener('wheel',e=>{e.preventDefault();const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());zoom(e.deltaY>0?1.12:.89,p.x,p.y)},{passive:false});
let drag=null,moved=false;svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,box:[...box]};moved=false});svg.addEventListener('pointermove',e=>{if(!drag)return;const ct=svg.getScreenCTM();const dx=(e.clientX-drag.x)/ct.a,dy=(e.clientY-drag.y)/ct.d;if(Math.abs(dx)+Math.abs(dy)>4){moved=true;svg.setPointerCapture(e.pointerId);}box=[drag.box[0]-dx,drag.box[1]-dy,box[2],box[3]];setbox()});svg.addEventListener('pointerup',()=>{drag=null});
function clear(){document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));document.querySelector('#route-layer').innerHTML=''}
function home(){info.innerHTML=`<h2>一张可核对的测试地图</h2><p>46 个实例 / 20 种基础模板<br>49 处接缝 / 7 处单向连接<br>3 条主路线 / 6 处奖励<br>6 个封口 / 7 个镜像实例</p><p>点击矩形查看模板、坐标、Port 配对和全部实际 Route。点击 C 编号查看接缝。滚轮缩放，拖动平移。</p><h3>已验证</h3><p>矩形不重叠、端口精确配对、类型与方向、固定能力过滤、三条主路各自抵达 Boss、所有奖励均可回到网络并抵达 Boss。</p><h3>读图方式</h3><p>矩形内显示「实例 ID · 模板 ID」。MX 表示水平镜像；Port ID 保持模板身份。接缝标记颜色对应地貌；箭头对应初始权限。红 × 为未用接口封口。</p><div class="note">仅验证几何与静态图。测试 Route、封口、镜像和接缝尚未经过 Godot 物理认证。关键骨架固定，间隙为有界随机 DFS 求解。时长与难度为占位设计值。</div><button class="download" onclick="download()">下载地图 JSON</button>`}
function download(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}));a.download='map-seed-271027.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function world(p){return [298+p.world2[0]/2*48,278+(p.world2[1]/2+12)*48]}
function show(i){clear();document.querySelector(`[data-id="${i.id}"]`).classList.add('selected');const t=LIB[i.module_id];let rows=Object.entries(i.ports).map(([id,p])=>{const c=DATA.connections.find(c=>c.id===p.connection);const self=i.id+'.'+id;const other=c?(c.a===self?c.b:c.a):'封口';return `<tr><td><b>${id}</b></td><td>${p.face}<br>${p.surface}<br>${p.permission}</td><td>${p.connection||'×'}<br>${other}<br>(${p.world2.map(v=>v/2).join(', ')})</td></tr>`}).join('');info.innerHTML=`<h2>${i.id} · ${i.module_id}</h2><p>${esc(i.name)}</p><span class="tag">${i.size_blocks.join(' × ')} Block</span><span class="tag">origin (${i.origin.join(', ')})</span><span class="tag">mirror_x: ${i.mirror_x}</span><h3>Port / 初始权限 / 连接</h3><table><tr><th>ID</th><th>方向与类型</th><th>目标 / 世界坐标</th></tr>${rows}</table><h3>全部实际有效 Route (${i.actual_routes.length})</h3>${i.actual_routes.map(r=>`<div class="route-row"><code>${r.from_port} → ${r.content?'奖励 → ':''}${r.to_port}</code><div class="hint">能力 ${r.required_abilities.join(', ')} · 难度 ${r.difficulty} · 占位 ${r.estimated_duration}s</div></div>`).join('')||'<p>起点 / Boss 使用专用锚点。</p>'}<h3>封口后无效 Route (${i.inactive_routes.length})</h3><p class="hint">${i.inactive_routes.map(r=>r.id).join(' / ')||'无'}</p><p class="hint">四 Port 枢纽未声明 U↔D；不会因为同属一个矩形而自动连通。镜像不会转置 Route 矩阵。</p><div class="note">${esc(t.closure_model)}<br>Route / 接缝 / 镜像 / 封口：未做 Godot 物理认证。</div>`;
const layer=document.querySelector('#route-layer');i.actual_routes.forEach((r,k)=>{const a=world(i.ports[r.from_port]),b=world(i.ports[r.to_port]),cx=298+(i.origin[0]+i.size_blocks[0]/2)*48,cy=278+(i.origin[1]+12+i.size_blocks[1]/2)*48;const p=document.createElementNS(NS,'path');p.setAttribute('d',r.from_port===r.to_port?`M${a[0]},${a[1]} C${cx-55},${cy-45} ${cx+55},${cy-45} ${b[0]},${b[1]}`:`M${a[0]},${a[1]} Q${cx+(k%2?17:-17)},${cy+(k%2?13:-13)} ${b[0]},${b[1]}`);p.setAttribute('stroke','#b53164');p.setAttribute('fill','none');p.setAttribute('stroke-width','2');p.setAttribute('stroke-opacity','.55');p.setAttribute('marker-end','url(#arrow)');layer.appendChild(p)})}
function connection(c){clear();const a=c.a.split('.')[0],b=c.b.split('.')[0];[a,b].forEach(id=>document.querySelector(`[data-id="${id}"]`).classList.add('selected'));info.innerHTML=`<h2>${c.id} · 接缝</h2><p><b>${c.a}</b> / <b>${c.b}</b></p><p>地貌：${c.surface}<br>世界坐标：(${c.world2.map(x=>x/2).join(', ')})<br>初始方向：${c.directions.length===2?'双向':'单向'}</p><h3>实际跨实例有向边</h3>${c.directions.map(([a,b])=>`<p><code>${a} → ${b}</code></p>`).join('')}<p class="hint">两端坐标精确重合、法线相反、地貌同类、权限兼容均已通过。动作与碰撞接缝尚未做物理认证。</p><button onclick="show(instances['${a}'])">查看 ${a}</button> <button onclick="show(instances['${b}'])">查看 ${b}</button>`}
svg.addEventListener('click',e=>{if(moved)return;const c=e.target.closest('[data-connection]');if(c){connection(DATA.connections.find(x=>x.id===c.dataset.connection));return}const i=e.target.closest('[data-id]');if(i)show(instances[i.dataset.id])});
document.querySelectorAll('[data-lane]').forEach(b=>b.onclick=()=>{clear();document.querySelectorAll('[data-lane]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const lane=b.dataset.lane;document.querySelectorAll('.module').forEach(x=>x.classList.toggle('faded',lane!=='all'&&!['shared',lane].includes(instances[x.dataset.id].lane)));if(lane==='all')home();else{const ids=[...new Set(DATA.main_paths[lane].map(n=>n.split('.')[0].split(':')[0]).filter(n=>instances[n]))];info.innerHTML=`<h2>${{upper:'A · 钩索路线',middle:'B · 基础探索路线',lower:'C · 反冲路线'}[lane]}</h2><p>在只保留本路线与共享实例的有向图中，已独立验证 START → BOSS。</p><h3>实例序列</h3><p>${ids.join(' → ')}</p><p>奖励支路不计入这条主路的必经序列；点击全图查看。</p><div class="note">全部真实有效 Route 均计入实际图。路线按钮只是高亮，不会删除图中的额外 Route。</div>`}});
document.querySelector('#find').onclick=()=>{const s=document.querySelector('#search').value.trim().toUpperCase();const i=instances[s],c=DATA.connections.find(c=>c.id===s);if(!i&&!c){info.innerHTML='<p>没有找到该编号。请输入 M01–M46 或 C01–C49。</p>';return}let x,y;if(i){show(i);[x,y]=[298+(i.origin[0]+i.size_blocks[0]/2)*48,278+(i.origin[1]+12+i.size_blocks[1]/2)*48]}else{connection(c);[x,y]=[298+c.world2[0]/2*48,278+(c.world2[1]/2+12)*48]}box=[x-500,y-350,1000,700];setbox()};document.querySelector('#search').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#find').click()});home();setbox();</script></html>
